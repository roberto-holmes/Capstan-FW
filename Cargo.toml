[package]
name = "capstan-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", path = "embassy/embassy-stm32", features = [
	"defmt",
	"stm32wba65ri",
	"time-driver-any",
	"memory-x",
	"exti",
	"embassy-crypto-aes128-ecb",
	"embassy-crypto-aes128-ccm",
	"embassy-crypto-p256-arith",
	"embassy-crypto-aes128-cmac",
	"embassy-crypto-rng",
] }
stm32-metapac = { version = "21", features = ["stm32wba65ri"] }
embassy-stm32-wpan = { version = "0.1.0", path = "embassy/embassy-stm32-wpan", features = [
	"defmt",
	"stm32wba65ri",
	"bt-hci",
	"wb-hci",
], optional = true }
embassy-sync = { version = "0.8.0", path = "embassy/embassy-sync", features = [
	"defmt",
] }
embassy-executor = { version = "0.10.0", path = "embassy/embassy-executor", features = [
	"platform-cortex-m",
	"executor-thread",
	"defmt",
] }
embassy-time = { version = "0.5.1", path = "embassy/embassy-time", features = [
	"defmt",
	"defmt-timestamp-uptime",
	"tick-hz-32_768",
] }
embassy-usb = { version = "0.6.0", path = "embassy/embassy-usb", features = [
	"defmt",
] }
embassy-futures = { version = "0.1.2", path = "embassy/embassy-futures" }
embassy-usb-driver = { version = "0.2.2", path = "embassy/embassy-usb-driver", features = [
	"defmt",
] }
embedded-sdmmc = "0.9.0"
embedded-hal-bus = "0.3.0"

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = [
	"inline-asm",
	"critical-section-single-core",
] }
cortex-m-rt = "0.7.0"
embedded-hal = "1.0.0"
embedded-io-async = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = { version = "0.9", default-features = false }
static_cell = "2"
stm32wb-hci = { git = "https://github.com/oueslatighaith/stm32wb-hci", branch = "master" } # using the same dependency as embassy/embassy-stm32-wpan
usbd-hid = { version = "0.10.2", features = ["defmt"] }

[features]
default = ["ble"]
# mac = ["dep:embassy-stm32-wpan", "embassy-stm32-wpan/wba-mac", "dep:embassy-net"]
ble = [
	"dep:embassy-stm32-wpan",
	"embassy-stm32-wpan/wba-ble",
	"embassy-stm32-wpan/ble-stack-basic",
	"embassy-stm32-wpan/linklayer6-ble-basic",
]
